name: Construir APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar proyecto Creaciones Yazmin
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir proyecto
          unzip -q unzip -q CreacionesYazminApp_base-1.zip -d proyecto
          cp -r proyecto/* .
          rm -rf proyecto

      - name: Instalar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d /tmp

      - name: Construir APK
        run: |
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Creaciones-Yazmin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
