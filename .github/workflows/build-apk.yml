name: Construir APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar proyecto
        run: |
          ZIP="CreacionesYazminApp_FINAL_v3_estable.zip"
          echo "ZIP encontrado: $ZIP"
          test -n "$ZIP"

          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir proyecto

          unzip -q "$ZIP" -d proyecto

          cp -r proyecto/* .
          sed -i 's/TextView productCard/LinearLayout productCard/' app/src/main/java/com/creacionesyazmin/app/MainActivity.java
          rm -rf proyecto

          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Instalar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d /tmp

      - name: Construir APK
        run: |
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Creaciones-Yazmin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
